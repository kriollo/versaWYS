# Un PR semanal por ecosistema con todas las actualizaciones agrupadas.
# Incluye versawys/kernel: cada versión nueva del kernel llega como PR con la CI corrida.
version: 2
updates:
    - package-ecosystem: composer
      directory: /versaWYS
      schedule:
          interval: weekly
      groups:
          php:
              patterns: ['*']

    - package-ecosystem: npm
      directory: /
      schedule:
          interval: weekly
      groups:
          frontend:
              patterns: ['*']

    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: monthly
