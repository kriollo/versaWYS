name: CI

on:
    push:
        branches: [main]
    pull_request:

jobs:
    php:
        runs-on: ubuntu-latest
        # PostgreSQL desechable para el ciclo real de respaldo (RespaldoPostgresTest). La versión es la del
        # pg_dump del runner: un pg_dump más antiguo que el servidor no respalda
        services:
            postgres:
                image: postgres:16-alpine
                env:
                    POSTGRES_PASSWORD: prueba-local
                    POSTGRES_DB: respaldo
                ports: ['55432:5432']
                options: --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 15
            postgres-panel:
                image: postgres:16-alpine
                env:
                    POSTGRES_PASSWORD: prueba-local
                    POSTGRES_DB: panel
                ports: ['55433:5432']
                options: --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 15
        env:
            VERSA_TEST_PG: 127.0.0.1:55432:respaldo:postgres:prueba-local
        strategy:
            fail-fast: false
            matrix:
                # El lock se resuelve para PHP 8.3 (config.platform): debe instalar en todas las soportadas
                php: ['8.3', '8.4']
        steps:
            - uses: actions/checkout@v7
            - uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  extensions: intl, mbstring, pdo_mysql, pdo_pgsql, pdo_sqlite, curl, fileinfo, zip
                  coverage: none
            # Desde composer.lock: lo mismo que se despliega
            - run: composer install --no-interaction --no-progress
            - run: composer audit
            # mago fmt (formato, el mismo de los proyectos) y pest (tests); el análisis estático del kernel corre en versawys-kernel
            - run: composer check
            # La misma suite con la base de prueba en PostgreSQL, el motor de producción
            - run: composer test
              env:
                  VERSA_TEST_DB: 127.0.0.1:55433:panel:postgres:prueba-local

    frontend:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6
              with:
                  version: 11
            - uses: actions/setup-node@v7
              with:
                  node-version: 22
            # Falla si pnpm-lock.yaml no corresponde a package.json
            - run: pnpm install --frozen-lockfile
            # Solo dependencias que llegan al navegador; las de compilación las vigila Dependabot
            - run: pnpm audit --prod
            - run: pnpm lint
            - run: pnpm compile
