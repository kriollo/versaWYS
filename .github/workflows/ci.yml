name: CI

on:
    push:
        branches: [main]
    pull_request:

jobs:
    php:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                # El lock se resuelve para PHP 8.3 (config.platform): debe instalar en todas las soportadas
                php: ['8.3', '8.4']
        steps:
            - uses: actions/checkout@v7
            - uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  extensions: intl, mbstring, pdo_mysql, pdo_pgsql, pdo_sqlite, curl, fileinfo, zip
                  coverage: none
            # Desde composer.lock: lo mismo que se despliega
            - run: composer install --no-interaction --no-progress
            - run: composer audit
            # pint (formato) y pest (tests); el análisis estático del kernel corre en versawys-kernel
            - run: composer check

    frontend:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6
              with:
                  version: 11
            - uses: actions/setup-node@v7
              with:
                  node-version: 22
            # Falla si pnpm-lock.yaml no corresponde a package.json
            - run: pnpm install --frozen-lockfile
            # Solo dependencias que llegan al navegador; las de compilación las vigila Dependabot
            - run: pnpm audit --prod
            - run: pnpm lint
            - run: pnpm compile
